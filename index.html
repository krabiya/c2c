<style>
:root{
  --bg:#faf6f0; --surface:#fff; --surface2:#f4eee6; --ink:#1d1715; --ink2:#4a413c; --muted:#7a6f67; --line:#ece4d9; --line2:#ddd2c3;
  --brand:#8b1e3f; --brand2:#6d1631; --brand-soft:#f8e8ed; --gold:#c8902e; --gold-soft:#fbf1dc;
  --green:#17784a; --green-soft:#e3f4ea; --red:#b83227; --red-soft:#fdeaea; --amber:#a86a12; --amber-soft:#fdf3dc; --blue:#2459a6; --blue-soft:#e6eefa;
  --r:14px; --r-sm:10px;
  --sh:0 1px 2px rgba(40,20,10,.05),0 4px 16px rgba(40,20,10,.06); --sh2:0 12px 40px rgba(40,20,10,.16);
  --f-d:'Fraunces',Georgia,serif; --f:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --wrap:1240px; --inv:#1d1715; --on-inv:#fff; --amber-ink:#6b4a0f; --adm-bg:#f6f3ef; --wish-bg:rgba(255,255,255,.92); --tile-ink:rgba(0,0,0,.38);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--f-d);font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.15}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px} .b{font-weight:700} .w100{width:100%} .tr{text-align:right} .nowrap{white-space:nowrap}
.row{display:flex;gap:12px;align-items:center} .row.wrap-ok{flex-wrap:wrap} .sp{flex:1}
.grid{display:grid;gap:16px}
.hide{display:none!important}
::selection{background:var(--brand-soft)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:11px 20px;font-weight:700;font-size:14px;transition:.15s;white-space:nowrap;background:var(--surface);border-color:var(--line2)}
.btn-brand{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn-dark{background:var(--inv);color:var(--on-inv);border-color:var(--inv)}
@media (hover:hover){.btn:hover{border-color:var(--ink2)}.btn-brand:hover{background:var(--brand2);border-color:var(--brand2)}.btn-dark:hover{opacity:.9}.btn-wa:hover{background:#178a45}}
.btn-gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn-wa{background:#1fa855;color:#fff;border-color:#1fa855}
.btn-ghost{background:transparent;border-color:var(--line2)}
.btn-sm{padding:8px 14px;font-size:13px} .btn-xs{padding:5px 10px;font-size:12px} .btn-lg{padding:15px 26px;font-size:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;position:relative;flex:none}
.icon-btn svg{width:20px;height:20px}
.count{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:99px;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--surface)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700;color:var(--ink2)}
.inp{width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-sm);padding:11px 13px;outline:none;transition:.15s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{resize:vertical;min-height:84px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px} .f3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.check{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer;padding:4px 0}
.check input{width:17px;height:17px;accent-color:var(--brand)}
.opt{border:1.5px solid var(--line2);border-radius:var(--r-sm);padding:14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;background:var(--surface);transition:.15s}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opt input{accent-color:var(--brand);margin-top:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:var(--inv);color:var(--on-inv);border-color:var(--inv)}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}

/* Cards / pills */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:20px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-green{background:var(--green-soft);color:var(--green)} .p-red{background:var(--red-soft);color:var(--red)} .p-amber{background:var(--amber-soft);color:var(--amber)} .p-blue{background:var(--blue-soft);color:var(--blue)} .p-gray{background:var(--surface2);color:var(--ink2)} .p-brand{background:var(--brand-soft);color:var(--brand)} .p-dark{background:var(--inv);color:var(--on-inv)}

/* Notice + strip + header */
.notice{background:var(--amber-soft);color:var(--amber-ink);text-align:center;font-size:13px;font-weight:600;padding:9px 16px;border-bottom:1px solid #f1dfb6}
.strip{background:#1d1715;color:#e9e2da;font-size:12.5px}
.strip .wrap{display:flex;gap:28px;justify-content:center;padding-top:8px;padding-bottom:8px;overflow:hidden;white-space:nowrap}
.strip b{color:#fff}
.strip-track{display:flex;justify-content:center;flex:1;min-width:0}
.strip-set{display:flex;gap:28px}
.strip-set+.strip-set{display:none}
@keyframes ticker{to{transform:translateX(-50%)}}
@media (max-width:640px){
  .strip .wrap{padding-left:0;padding-right:0}
  .strip-track{flex:none;justify-content:flex-start;width:max-content;animation:ticker 20s linear infinite}
  .strip-set+.strip-set{display:flex}
  .strip-set{padding-right:28px}
  .strip:hover .strip-track,.strip:active .strip-track{animation-play-state:paused}
}
@media (max-width:640px) and (prefers-reduced-motion:reduce){
  .strip-track{animation:none}
  .strip .wrap{overflow-x:auto}
  .strip-set+.strip-set{display:none}
}
.hdr{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.hdr .wrap{display:flex;align-items:center;gap:20px;height:72px}

.logo-t b{display:block;font-family:var(--f-d);font-size:19px;line-height:1.05;font-weight:700}
.logo-t span{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;border:1.5px solid var(--line2);background:var(--bg);border-radius:999px;padding:11px 18px 11px 44px;outline:none}
.search input:focus{border-color:var(--brand);background:var(--surface)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.hnav{display:flex;gap:4px;align-items:center}
.hnav a{padding:9px 13px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink2)}
.hnav a:hover,.hnav a.on{background:var(--surface2);color:var(--ink)}
.hact{display:flex;gap:8px;align-items:center;margin-left:auto}
.catnav{background:var(--surface);border-bottom:1px solid var(--line)}
.catnav .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:8px;padding-bottom:8px}
.catnav .wrap::-webkit-scrollbar{display:none}
.catnav a{white-space:nowrap;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2)}
.catnav a:hover,.catnav a.on{background:var(--brand-soft);color:var(--brand)}
.cat-track{display:flex}
.cat-set{display:flex;gap:6px}
.cat-set+.cat-set{display:none}
@media (max-width:640px){
  .catnav .wrap{overflow:hidden;padding-left:0;padding-right:0}
  .cat-track{width:max-content;animation:ticker 32s linear infinite}
  .cat-set+.cat-set{display:flex}
  .cat-set{padding-right:6px}
  .catnav:hover .cat-track,.catnav:active .cat-track,.catnav:focus-within .cat-track{animation-play-state:paused}
}
@media (max-width:640px) and (prefers-reduced-motion:reduce){
  .cat-track{animation:none}
  .catnav .wrap{overflow-x:auto}
  .cat-set+.cat-set{display:none}
}

/* Hero */
.hero{padding:40px 0 28px}
.hero-g{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);padding:6px 12px;border-radius:999px}
.hero h1{font-size:clamp(34px,5vw,58px);margin:18px 0 16px;font-weight:600}
.hero h1 em{font-style:italic;color:var(--brand)}
.hero p.lead{font-size:17px;color:var(--ink2);max-width:540px;margin:0 0 26px}
.hero-stats{display:flex;gap:30px;margin-top:30px;flex-wrap:wrap}
.hero-stats div b{display:block;font-family:var(--f-d);font-size:26px;font-weight:600}
.hero-stats div span{font-size:13px;color:var(--muted)}
.deal{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh2);padding:18px;transform:rotate(1deg)}
.deal .tile,.deal .ph,.deal a>img{height:250px;border-radius:16px}
.deal-tag{position:absolute;top:-12px;left:20px;background:var(--gold);color:#fff;font-weight:800;font-size:12px;padding:6px 12px;border-radius:999px;letter-spacing:.04em;box-shadow:var(--sh)}
.deal-float{position:absolute;bottom:-16px;right:-12px;background:var(--inv);color:var(--on-inv);border-radius:14px;padding:10px 14px;font-size:12px;box-shadow:var(--sh2);transform:rotate(-2deg)}
.deal-float b{color:var(--gold);font-size:14px}

/* Price compare */
.cmp{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.cmp-r{display:grid;grid-template-columns:88px 1fr 84px;gap:10px;align-items:center;font-size:13px}
.cmp-t{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.cmp-f{height:100%;border-radius:99px;background:#b9aea3}
.cmp-r.us .cmp-f{background:var(--brand)}
.cmp-r.us{font-weight:800}
.cmp-r .v{text-align:right;font-variant-numeric:tabular-nums}

/* Sections */
.sec{padding:34px 0}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.sec-h h2{font-size:clamp(24px,3vw,32px)}
.sec-h p{margin:6px 0 0;color:var(--muted)}
.sec-h a.more{font-weight:700;color:var(--brand);font-size:14px;white-space:nowrap}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.trust div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:12px;align-items:flex-start}
.trust i{font-style:normal;font-size:22px;width:42px;height:42px;border-radius:12px;background:var(--gold-soft);display:grid;place-items:center;flex:none}
.trust b{display:block;font-size:14px} .trust span{font-size:12.5px;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cat{border-radius:var(--r);padding:18px 14px;background:var(--bg-c);border:1px solid rgba(0,0,0,.04);display:flex;flex-direction:column;gap:6px;transition:.15s;min-height:128px}
@media (hover:hover){.cat:hover{transform:translateY(-2px);box-shadow:var(--sh)}}
.cat i{font-style:normal;font-size:32px}
.cat b{font-size:14px;line-height:1.25} .cat span{font-size:12px;color:var(--ink2);opacity:.75}

/* Product tile & cards */
.tile{background:radial-gradient(120% 90% at 30% 20%,rgba(255,255,255,.9),rgba(255,255,255,0) 60%),var(--bg-c,#eee);display:grid;place-items:center;position:relative;overflow:hidden;width:100%;height:100%}
.tile .te{font-size:clamp(46px,6vw,74px);filter:drop-shadow(0 8px 10px rgba(0,0,0,.14));transform:translateY(-6px)}
.tile .tb{position:absolute;left:12px;bottom:10px;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--tile-ink)}
.ph{width:100%;height:100%;position:relative;overflow:hidden;background:var(--bg-c,#eee)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.pi{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat}
.ph.cut .pi{inset:9%;background-size:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.14))}
.ph.cut{background:radial-gradient(120% 90% at 30% 20%,rgba(255,255,255,.95),rgba(255,255,255,0) 65%),var(--bg-c,#eee)}
.ph.cut img{object-fit:contain;padding:9%;filter:drop-shadow(0 10px 12px rgba(0,0,0,.14))}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:16px}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(212px,232px);gap:16px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.hscroll>*{scroll-snap-align:start}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;position:relative;transition:.15s}
@media (hover:hover){.pc:hover{box-shadow:var(--sh2);transform:translateY(-2px)}}
.pc-img{display:block;aspect-ratio:1/0.86;position:relative}
.pc-img img{width:100%;height:100%;object-fit:cover}
.pc-img,.pd-img{overflow:hidden}
.pc-img>.ph,.pc-img>.tile,.pc-img>img,.pd-img>.ph,.pd-img>.tile,.pd-img>img{position:absolute;inset:0}
.pd-img{position:relative}
.badge-off{position:absolute;top:10px;left:10px;background:var(--brand);color:#fff;font-weight:800;font-size:12px;padding:4px 9px;border-radius:8px}
.sc{position:absolute;bottom:10px;right:10px}
.wish{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:99px;border:0;background:var(--wish-bg);color:#c8bcb0;font-size:17px;display:grid;place-items:center;box-shadow:var(--sh)}
.wish.on{color:var(--brand)}
.pc-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.pc-brand{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pc-name{font-weight:700;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.pc-name:hover{color:var(--brand)}
.pc-price{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.pc-price b{font-size:19px;font-weight:800}
.pc-price s{color:var(--muted);font-size:13px}
.pc-save{font-size:12px;color:var(--green);font-weight:700;margin-bottom:10px}
.pc-body .btn{margin-top:auto}

/* Banners */
.banner{border-radius:22px;padding:30px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;position:relative;overflow:hidden}
.banner h2{font-size:clamp(24px,3.4vw,36px)}
.banner p{margin:8px 0 0;opacity:.85;max-width:560px}
.b-dark{background:linear-gradient(120deg,#2a1218,#5b1530 60%,#8b1e3f);color:#fff}
.b-gold{background:linear-gradient(120deg,#fbf1dc,#f6e2b6);color:#3d2a08}
.cd{display:flex;gap:8px}
.cd div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 12px;text-align:center;min-width:64px}
.cd b{display:block;font-family:var(--f-d);font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.cd span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.mini{width:44px;height:44px;border-radius:10px;overflow:hidden;flex:none}
.mini .te{font-size:22px;transform:none} .mini .tb{display:none}
.mini img{width:100%;height:100%;object-fit:cover}

/* Shop layout */
.shop{display:grid;grid-template-columns:250px 1fr;gap:26px;padding:26px 0 40px}
.filters{position:sticky;top:90px;align-self:start}
.fgrp{border-bottom:1px solid var(--line);padding:14px 0}
.fgrp:first-child{padding-top:0}
.fgrp h4{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.flink{display:flex;justify-content:space-between;padding:6px 10px;border-radius:8px;font-size:14px;cursor:pointer}
.flink:hover{background:var(--surface2)} .flink.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
.flink span{color:var(--muted);font-size:12px}
.shop-top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.shop-top h1{font-size:28px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty i{font-style:normal;font-size:44px;display:block;margin-bottom:10px}

/* Product page */
.crumb{font-size:13px;color:var(--muted);padding:18px 0}
.crumb a:hover{color:var(--brand)}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding-bottom:40px}
.pd-img{border-radius:22px;overflow:hidden;aspect-ratio:1/0.9;border:1px solid var(--line);position:sticky;top:90px}
.pd-img .te{font-size:clamp(90px,14vw,170px)}
.pd-img img{width:100%;height:100%;object-fit:cover}
.pd h1{font-size:clamp(26px,3vw,36px);margin:6px 0 12px}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:18px 0}
.pbig{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pbig b{font-size:36px;font-weight:800;letter-spacing:-.02em}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;background:var(--surface)}
.qty button{width:36px;height:36px;border:0;background:transparent;font-size:18px;font-weight:700}
.qty span,.qty input{min-width:34px;width:40px;text-align:center;font-weight:800;border:0;background:transparent;outline:none}
.qty.sm button{width:28px;height:28px;font-size:15px}
.assure{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.assure div{display:flex;gap:10px;align-items:center;font-size:13px;background:var(--surface2);border-radius:12px;padding:11px 12px}
.specs td:first-child{color:var(--muted);width:42%}

/* Cart / checkout */
.cart-g{display:grid;grid-template-columns:1fr 380px;gap:26px;padding:24px 0 50px;align-items:start}
.cl{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.cl:last-child{border-bottom:0}
.cl .mini{width:76px;height:76px}
.sum-r{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
.sum-r.tot{font-size:19px;font-weight:800;border-top:1px solid var(--line);margin-top:8px;padding-top:14px}
.steps{display:flex;gap:0;margin:20px 0 6px}
.step{flex:1;text-align:center;position:relative;font-size:12px;font-weight:700;color:var(--muted)}
.step:before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:3px;background:var(--line2);z-index:0}
.step:first-child:before{display:none}
.step i{font-style:normal;width:28px;height:28px;border-radius:99px;background:var(--surface);border:3px solid var(--line2);display:grid;place-items:center;margin:0 auto 6px;position:relative;z-index:1;font-size:12px}
.step.done{color:var(--ink)} .step.done i{background:var(--green);border-color:var(--green);color:#fff} .step.done:before{background:var(--green)}

/* Footer */
.foot{background:#1d1312;color:#cfc4ba;padding:46px 0 26px;margin-top:30px}
.foot-g{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:30px}
.foot h4{color:#fff;font-size:14px;margin:0 0 12px;letter-spacing:.04em}
.foot a{display:block;padding:4px 0;font-size:14px} .foot a:hover{color:#fff}
.foot .logo-t b{color:#fff}
.foot-b{border-top:1px solid #3a2a27;margin-top:30px;padding-top:18px;font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Mobile tab bar */
.tabbar{display:none}

/* Toast / modal / tip */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,440px)}
.toast{background:var(--inv);color:var(--on-inv);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:var(--sh2);animation:tin .25s ease;pointer-events:auto;display:flex;gap:10px;align-items:center}
.toast.ok{background:#135c39} .toast.warn{background:#7a4b07} .toast.err{background:#8a231b}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.ov{position:fixed;inset:0;background:rgba(20,10,8,.5);z-index:200;display:grid;place-items:center;padding:16px;animation:fin .2s}
@keyframes fin{from{opacity:0}}
.md{background:var(--surface);border-radius:20px;width:min(560px,100%);max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;box-shadow:var(--sh2);animation:tin .25s}
.md-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.md-h h3{font-size:20px}
.md-b{padding:20px;overflow-wrap:anywhere}
.x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:99px;font-size:18px}
#tip{position:fixed;z-index:400;background:var(--inv);color:var(--on-inv);padding:8px 11px;border-radius:10px;font-size:12.5px;pointer-events:none;box-shadow:var(--sh2);display:none;line-height:1.4;max-width:240px}
#tip b{font-size:14px}
.demo-fab{position:fixed;right:18px;bottom:18px;z-index:90;background:var(--inv);color:var(--on-inv);border:0;border-radius:999px;padding:11px 16px;font-weight:700;font-size:13px;box-shadow:var(--sh2);display:flex;gap:8px;align-items:center}
.demo-fab .dot{width:8px;height:8px;border-radius:99px;background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.25)}
.dlist a{display:flex;gap:12px;padding:11px 12px;border-radius:12px;align-items:flex-start}
.dlist a:hover{background:var(--surface2)}
.dlist i{font-style:normal;font-size:20px;width:30px;text-align:center}
.dlist b{display:block;font-size:14px} .dlist span{font-size:12.5px;color:var(--muted)}
.dsec{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 12px 4px}

/* ===== ADMIN ===== */
.adm{display:grid;grid-template-columns:248px 1fr;min-height:100vh;min-height:100dvh;background:var(--adm-bg)}
.side{background:#1b1413;color:#cbbfb5;padding:18px 14px;position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.side .logo{padding:4px 8px 18px}
.side .logo-t b{color:#fff;font-size:17px} .side .logo-t span{color:#9b8d82}
.side a.nl{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px}
.side a.nl:hover{background:rgba(255,255,255,.06);color:#fff}
.side a.nl.on{background:var(--brand);color:#fff}
.side a.nl svg{width:19px;height:19px;flex:none}
.side .nb{margin-left:auto;background:var(--gold);color:#1b1413;font-size:11px;font-weight:800;border-radius:99px;padding:1px 8px}
.side .sd{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7d6f66;font-weight:800;margin:14px 12px 4px}
.side-f{margin-top:auto;padding-top:14px;border-top:1px solid #2e2321}
.adm-main{min-width:0}
.adm-top{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:30}
.adm-top h1{font-family:var(--f);font-size:19px;font-weight:800;letter-spacing:-.01em}
.adm-body{padding:24px;max-width:1400px}
.menu-btn{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.kpi b{display:block;font-size:27px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi small{font-size:12.5px;color:var(--muted)}
.kpi small.up{color:var(--green);font-weight:700} .kpi small.dn{color:var(--red);font-weight:700}
.dash-g{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}
.ch-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.ch-h h3{font-family:var(--f);font-size:15px;font-weight:800}
.ch-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f)}
.chart .bar{fill:var(--brand)}
.chart .bar.today{fill:var(--gold)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover+.bar,.chart g.col:hover .bar{opacity:.82}
.chart .dl{fill:var(--ink);font-size:11.5px;font-weight:700;font-family:var(--f)}
.hb{display:flex;flex-direction:column;gap:10px}
.hb-r{display:grid;grid-template-columns:minmax(90px,150px) 1fr 74px;gap:10px;align-items:center;font-size:13px}
.hb-r .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.hb-t{height:12px;background:var(--surface2);border-radius:4px;overflow:hidden}
.hb-f{height:100%;background:var(--brand);border-radius:0 4px 4px 0}
.hb-r .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.live{display:flex;gap:10px;align-items:center;background:var(--green-soft);color:var(--green);border-radius:12px;padding:11px 14px;font-size:13.5px;font-weight:600;margin-bottom:18px}
.live .dot{width:9px;height:9px;border-radius:99px;background:#1fa855;box-shadow:0 0 0 4px rgba(31,168,85,.2);animation:pulse 1.6s infinite;flex:none}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(31,168,85,.05)}}
.list-r{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.list-r:last-child{border-bottom:0}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .inp{max-width:320px}
.stk{display:inline-flex;align-items:center;gap:6px}
.stk b{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}

/* POS */
.pos{display:grid;grid-template-columns:1fr 1.05fr;gap:16px;align-items:start}
.scanbox{position:relative;background:#120d0c;border-radius:16px;overflow:hidden;min-height:250px;display:grid;place-items:center;margin:14px 0}
#reader{width:100%}
#reader video{width:100%!important;display:block;border-radius:16px}
.cam-video{width:100%;height:290px;object-fit:cover;display:block;background:#000}
.cam-wait{color:#d8cdc4;padding:40px 10px;text-align:center;font-weight:600}
#reader,#reader2{position:relative}
.scan-guide{position:absolute;left:8%;right:8%;top:22%;bottom:22%;border:2px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.25);pointer-events:none}
.cam-ctl{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:3}
.cam-ctl .btn.on{background:var(--gold);border-color:var(--gold);color:#1b1413}
.scan-ph{color:#d8cdc4;text-align:center;padding:26px;display:flex;flex-direction:column;gap:12px;align-items:center}
.scan-ph .ic{font-size:40px}
.scan-line{position:absolute;left:12%;right:12%;top:50%;height:2px;background:#ff4d6d;box-shadow:0 0 12px #ff4d6d;animation:scan 2s ease-in-out infinite;pointer-events:none}
@keyframes scan{0%,100%{transform:translateY(-55px)}50%{transform:translateY(55px)}}
.scan-in{display:flex;gap:8px;position:relative}
.scan-in .inp{font-size:16px;padding:13px 14px 13px 44px;font-variant-numeric:tabular-nums}
.scan-in svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.sugg{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--sh2);z-index:10;margin-top:6px;overflow:hidden}
.sugg button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:9px 12px;text-align:left;font-size:13.5px}
.sugg button:hover{background:var(--surface2)}
.dchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.dchip{display:flex;gap:8px;align-items:center;border:1px dashed var(--line2);border-radius:10px;padding:6px 10px 6px 6px;background:var(--bg);font-size:12px;text-align:left}
.dchip:hover{border-color:var(--brand);background:var(--brand-soft)}
.dchip .mini{width:30px;height:30px;border-radius:7px} .dchip .mini .te{font-size:16px}
.dchip code{font-size:10.5px;color:var(--muted);display:block}
.flash{animation:flash .6s}
@keyframes flash{0%{background:#dff7e8}100%{background:transparent}}
.bl{display:grid;grid-template-columns:44px 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line2)}
.bl .nm{font-weight:700;font-size:14px;line-height:1.25}
.bl .lt{font-weight:800;min-width:72px;text-align:right;font-variant-numeric:tabular-nums}
.bill-tot{background:var(--surface2);border-radius:14px;padding:14px 16px;margin-top:14px}
.bill-tot .grand{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.bill-tot .grand b{font-size:32px;letter-spacing:-.02em}

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const num=n=>Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const kfmt=n=>n>=100000?'₹'+(n/100000).toFixed(1)+'L':n>=1000?'₹'+(n/1000).toFixed(n>=10000?0:1)+'k':'₹'+Math.round(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cmpAt=p=>Math.max(p.mrp||0,p.on||0);
const off=p=>{const c=cmpAt(p);return c>p.p?Math.round((1-p.p/c)*100):0};

const ftime=ts=>new Date(ts).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
const fdt=ts=>fdate(ts)+', '+ftime(ts);
const startOfDay=(t=Date.now())=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
function ean(b12){let s=0;for(let i=0;i<12;i++)s+=(+b12[i])*(i%2?3:1);return b12+((10-s%10)%10)}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function seed(){
  const r=rng(20241020), now=Date.now();
  const products=RAW.map((x,i)=>({
    id:'p'+(i+1), n:x[0], b:x[1], c:x[2], mrp:x[3], on:x[4], p:x[5], s:x[6], e:x[7],
    t:x[8]?x[8].split(' '):[], sp:x[9], bc:ean('8906012'+String(i+1).padStart(5,'0')),
    vis:true, added: now - (x[8].includes('new') ? Math.floor(r()*3) : 4+Math.floor(r()*120))*DAY
  }));
  const orders=[]; let bill=1001, ord=501;
  const pick=()=>{ // cheaper items sell more often
    const pool=products.filter(p=>p.p<1600); return r()<.82?pool[Math.floor(r()*pool.length)]:products[Math.floor(r()*products.length)];
  };
  for(let d=29; d>=0; d--){
    const day=startOfDay(now-d*DAY), dow=new Date(day).getDay();
    let n=6+Math.floor(r()*10)+(dow===0||dow===6?5:0);
    for(let k=0;k<n;k++){
      const ts=day+(10*60+Math.floor(r()*11*60))*60000;
      if(ts>now) continue;
      const items=[]; const cnt=1+Math.floor(r()*3);
      for(let j=0;j<cnt;j++){const p=pick(); if(!items.find(i=>i[0]===p.id)) items.push([p.id,1+(r()<.2?1:0),p.p])}
      const total=items.reduce((a,i)=>a+i[1]*i[2],0);
      const pr=r(); orders.push({id:'B'+(bill++),ch:'store',ts,items,sub:total,disc:0,total,pay:pr<.45?'Cash':pr<.9?'UPI':'Card',status:'Completed'});
    }
    if(r()<.55||d<4){
      const ts=day+(9*60+Math.floor(r()*13*60))*60000; if(ts>now) continue;
      const items=[]; const cnt=1+Math.floor(r()*2);
      for(let j=0;j<cnt;j++){const p=pick(); if(!items.find(i=>i[0]===p.id)) items.push([p.id,1,p.p])}
      const sub=items.reduce((a,i)=>a+i[1]*i[2],0), del=sub>=499?0:49, gift=r()<.3?30:0;
      const st=d>=3?'Delivered':d===2?(r()<.5?'Delivered':'Dispatched'):d===1?'Packed':'Placed';
      const nm=NAMES[Math.floor(r()*NAMES.length)], pl=PLACES[Math.floor(r()*PLACES.length)];
      orders.push({id:'C2C'+(ord++),ch:'online',ts,items,sub,del,gift,disc:0,total:sub+del+gift,pay:r()<.6?'UPI':'COD',status:st,demo:true,
        mode:pl==='Gauribidanur'&&r()<.5?'pickup':'delivery',
        cust:{name:nm,phone:String(6+Math.floor(r()*4))+String(Math.floor(r()*1e9)).padStart(9,'0'),addr:'#'+(10+Math.floor(r()*300))+', '+['Main Road','2nd Cross','Station Road','MG Road','Market Street'][Math.floor(r()*5)]+', '+pl,pin:pl==='Gauribidanur'?'561208':'5'+String(Math.floor(r()*99999)).padStart(5,'0')}});
    }
  }
  orders.sort((a,b)=>a.ts-b.ts);
  bill=1001; ord=501; orders.forEach(o=>{o.id=o.ch==='store'?'B'+(bill++):'C2C'+(ord++)});
  return {
    products, orders, cart:[], wish:[],
    enq:[
      {id:'E1',demo:true,name:'Farhan Ali',phone:'6929013129',org:'Wedding — 250 guests',need:'Return gift crockery sets ~250 pcs, budget ₹150/pc',ts:now-1*DAY,done:false},
      {id:'E2',demo:true,name:'Divya S',phone:'9583259478',org:'Sri Sai School',need:'Classmate pens 500 pcs + A4 paper 20 packs',ts:now-3*DAY,done:true},
    ],
    seq:{bill, ord},
    settings:{noticeOn:false, notice:'📢 Dear Customers, our store will remain closed tomorrow due to personal work. All pending parcels will be dispatched today itself. 🙏',
      delFee:49, freeAbove:499, gift:30, upi:'', hours:'10:00 AM – 9:30 PM · All days', pin:'1234'}
  };
}

/* ---------- small components ---------- */
function img(p,cls=''){
  if(p.img) return `<img src="${p.img}" alt="${esc(p.n)}" class="${cls}">`;
  const ph=window.PHOTOS?PHOTOS[p.id]:null;
  if(ph!=null) return `<div class="ph ${ph?'cut':''} ${cls}" style="--bg-c:${catOf(p.c).bg}"><i class="pi pi-${p.id}" role="img" aria-label="${esc(p.n)}"></i></div>`;
  return `<div class="tile ${cls}" style="--bg-c:${catOf(p.c).bg}"><span class="te">${p.e||'📦'}</span><span class="tb">${esc(p.b)}</span></div>`;
}
function stockChip(p){
  if(p.s<=0) return '<span class="pill p-dark sc">Sold out</span>';
  if(p.s<=3) return `<span class="pill p-amber sc">Only ${p.s} left</span>`;
  if(has(p,'restock')) return '<span class="pill p-green sc">Restocked</span>';
  if(has(p,'new')) return '<span class="pill p-blue sc">New</span>';
  return '';
}
function saveLine(p){
  if(p.on&&p.on>p.p) return `<div class="pc-save">₹${num(p.on-p.p)} less than online</div>`;
  if(p.mrp&&p.mrp>p.p) return `<div class="pc-save">You save ${inr(p.mrp-p.p)} on MRP</div>`;
  return `<div class="pc-save" style="color:var(--muted)">Best price in town</div>`;
}
function card(p){
  const o=off(p), c=cmpAt(p);
  return `<article class="pc">
    <a href="#/p/${p.id}" class="pc-img">${img(p)}${o?`<span class="badge-off">-${o}%</span>`:''}${stockChip(p)}</a>
    <button class="wish ${DB.wish.includes(p.id)?'on':''}" onclick="toggleWish('${p.id}',this)" aria-label="Save to wishlist">♥</button>
    <div class="pc-body">
      <div class="pc-brand">${esc(p.b)}</div>
      <a href="#/p/${p.id}" class="pc-name">${esc(p.n)}</a>
      <div class="pc-price"><b>${inr(p.p)}</b>${c>p.p?`<s>${inr(c)}</s>`:''}</div>
      ${saveLine(p)}
      ${p.s>0?`<button class="btn btn-sm btn-brand w100" onclick="addToCart('${p.id}')">Add to cart</button>`
             :`<button class="btn btn-sm btn-ghost w100" disabled>Sold out</button>`}
    </div></article>`;
}
function cmpBars(p){
  const rows=[]; if(p.mrp) rows.push(['MRP',p.mrp]); if(p.on) rows.push(['Online',p.on]); rows.push(['C2C price',p.p,1]);
  const mx=Math.max(...rows.map(r=>r[1]));
  return `<div class="cmp">${rows.map(r=>`<div class="cmp-r ${r[2]?'us':''}"><span>${r[0]}</span><div class="cmp-t"><div class="cmp-f" style="width:${Math.max(4,r[1]/mx*100)}%"></div></div><span class="v">${inr(r[1])}${r[0]==='Online'?'+':''}</span></div>`).join('')}</div>`;
}
function visible(){return DB.products.filter(p=>p.vis!==false)}
function soldMap(since=0){const m={};DB.orders.forEach(o=>{if(o.ts>=since)o.items.forEach(i=>{m[i[0]]=(m[i[0]]||0)+i[1]})});return m}

/* ---------- toast / modal / tooltip ---------- */
function toast(msg,type=''){
  const t=document.createElement('div'); t.className='toast '+type; t.innerHTML=msg; $('#toasts').appendChild(t);
  setTimeout(()=>{t.style.transition='.3s';t.style.opacity='0';setTimeout(()=>t.remove(),300)},3200);
}
function modal(title,body,{wide=false,cls=''}={}){
  closeModal();
  const o=document.createElement('div'); o.className='ov'; o.id='ov';
  o.innerHTML=`<div class="md ${cls}" style="${wide?'width:min(820px,100%)':''}" role="dialog" aria-modal="true"><div class="md-h"><h3>${title}</h3><button class="x" onclick="closeModal()" aria-label="Close">×</button></div><div class="md-b">${body}</div></div>`;
  o.addEventListener('click',e=>{if(e.target===o)closeModal()});
  document.body.appendChild(o); document.body.classList.add('modal-open');
}
function closeModal(){const o=$('#ov'); if(o){ if(o.dataset.cam) stopCamera(); o.remove(); } document.body.classList.remove('modal-open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const tip=$('#tip');
document.addEventListener('mousemove',e=>{
  const t=e.target.closest&&e.target.closest('[data-tip]');
  if(!t){tip.style.display='none';return}
  tip.innerHTML=t.dataset.tip; tip.style.display='block';
  const w=tip.offsetWidth, x=Math.min(e.clientX+14, innerWidth-w-10);
  tip.style.left=x+'px'; tip.style.top=(e.clientY-tip.offsetHeight-12)+'px';
});

/* ---------- cart / wishlist ---------- */
function cartQty(id){const l=DB.cart.find(c=>c.id===id);return l?l.q:0}
function cartCount(){return DB.cart.reduce((a,c)=>a+c.q,0)}
function addToCart(id,q=1){
  const p=P(id); if(!p) return;
  const cur=cartQty(id);
  if(cur+q>p.s){ toast(p.s<=0?'Sorry, this item is sold out':`Only ${p.s} in stock`,'warn'); return }
  const l=DB.cart.find(c=>c.id===id); if(l) l.q+=q; else DB.cart.push({id,q});
  save(); updateBadges();
  toast(`✓ Added <b>${esc(p.n)}</b> &nbsp;<a href="#/cart" style="text-decoration:underline">View cart</a>`,'ok');
}
function setCartQty(id,q){
  const p=P(id); const l=DB.cart.find(c=>c.id===id); if(!l) return;
  if(q>p.s){toast(`Only ${p.s} in stock`,'warn'); q=p.s}
  if(q<=0) DB.cart=DB.cart.filter(c=>c.id!==id); else l.q=q;
  save(); render();
}
function toggleWish(id,el){
  const i=DB.wish.indexOf(id); if(i>-1) DB.wish.splice(i,1); else DB.wish.push(id);
  save(); if(el) el.classList.toggle('on',i===-1); updateBadges();
  toast(i>-1?'Removed from wishlist':'♥ Saved to wishlist');
}
function updateBadges(){ $$('.cartN').forEach(e=>{const n=cartCount(); e.textContent=n; e.style.display=n?'grid':'none'}) }
function cartTotals(coupon){
  const S=DB.settings;
  const lines=DB.cart.map(c=>({p:P(c.id),q:c.q})).filter(l=>l.p);
  const sub=lines.reduce((a,l)=>a+l.p.p*l.q,0);
  const mrp=lines.reduce((a,l)=>a+(cmpAt(l.p)||l.p.p)*l.q,0);
  return {lines,sub,mrp,save:mrp-sub,S};
}

function parseHash(){const h=location.hash.slice(1)||'/';const [path,qs]=h.split('?');return {path,parts:path.split('/').filter(Boolean),q:Object.fromEntries(new URLSearchParams(qs||''))}}
function go(h){location.hash=h}
let lastPath='', timers=[];
function render(){
  timers.forEach(clearInterval); timers=[];
  stopCamera(); closeModal();
  const r=parseHash(), [a,b,c]=r.parts;
  let html, admin=a==='admin';
  document.body.classList.toggle('has-tabs',true);
  if(admin){
    if(!AUTH) html=pgLogin();
    else{
      const v=b||'dash';
      const pages={dash:pgDash,pos:pgPOS,inventory:pgInv,product:()=>pgForm(c,r.q),orders:()=>pgOrders(r.q),sales:()=>pgSales(r.q),labels:pgLabels,settings:pgSettings};
      html=(pages[v]||pgDash)(r);
    }
  } else {
    const pages={'':pgHome,shop:()=>pgShop(r.q),p:()=>pgProduct(b),offers:pgOffers,cart:pgCart,checkout:pgCheckout,order:()=>pgOrder(b),track:()=>pgTrack(r.q),wholesale:pgWholesale,visit:pgVisit,wishlist:pgWish};
    html=shell((pages[a||'']||pgHome)(r), a||'');
  }
  $('#app').innerHTML=html + (admin&&AUTH?`<button class="demo-fab" onclick="demoGuide()"><span class="dot"></span>Demo pages</button>`:'');
  if(r.path!==lastPath){window.scrollTo(0,0);lastPath=r.path}
  setTabH(); updateBadges();
  AFTER.splice(0).forEach(fn=>{try{fn()}catch(e){console.error(e)}});
}

function startCountdown(){
  const el=$('#cd'); if(!el) return;
  const tick=()=>{
    const now=new Date(), dow=now.getDay(); let target, label;
    if(dow===6||dow===0){ target=new Date(now); target.setDate(now.getDate()+(dow===6?1:0)); target.setHours(23,59,59,0); label='Ends in'; }
    else { target=new Date(now); target.setDate(now.getDate()+(6-dow)); target.setHours(0,0,0,0); label='Starts in'; }
    let s=Math.max(0,Math.floor((target-now)/1000)); const d=Math.floor(s/86400); s%=86400; const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60;
    const pad=n=>String(n).padStart(2,'0');
    el.innerHTML=[[d,'days'],[pad(h),'hrs'],[pad(m),'min'],[pad(s),'sec']].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
    const l=$('#cdLabel'); if(l) l.textContent=label;
  };
  tick(); timers.push(setInterval(tick,1000));
}

function ckVals(){

}

/* ---------- Face ID / fingerprint unlock (WebAuthn passkey on this device) ----------
   Set up only after a PIN login. The passkey lives in this phone's secure chip; unlocking
   checks the phone's own Face ID / Touch ID / fingerprint and verifies the key's signature. */
const BIO_KEY='c2c_admin_bio';
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const cat=(...a)=>{const o=new Uint8Array(a.reduce((n,x)=>n+x.length,0));let i=0;a.forEach(x=>{o.set(x,i);i+=x.length});return o};
function bioGet(){try{return JSON.parse(localStorage.getItem(BIO_KEY)||'null')}catch(e){return null}}
function bioSet(v){try{v?localStorage.setItem(BIO_KEY,JSON.stringify(v)):localStorage.removeItem(BIO_KEY)}catch(e){}}
function bioName(){const u=navigator.userAgent;
  if(/iPhone|iPad|iPod/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)) return 'Face ID / Touch ID';
  if(/Macintosh/.test(u)) return 'Touch ID'; if(/Android/.test(u)) return 'fingerprint / face unlock';
  if(/Windows/.test(u)) return 'Windows Hello'; return 'fingerprint / face';}
async function bioSupported(){
  try{return location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'?!!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()):false}catch(e){return false}}
async function bioRegister(){
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'C2C Gift House Admin'},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'C2C Admin',displayName:'C2C Gift House Admin'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
      timeout:60000,attestation:'none'}});
    const r=cred.response; let pub=null,alg=null;
    try{if(r.getPublicKey){pub=b64u(r.getPublicKey());alg=r.getPublicKeyAlgorithm()}}catch(e){}
    bioSet({id:b64u(cred.rawId),pub,alg,at:Date.now(),dev:bioName()});
    toast(`✓ ${bioName()} unlock is on for this device`,'ok'); return true;
  }catch(e){if(e&&e.name!=='NotAllowedError')toast('Could not set up: '+esc(e.message||e),'err');else toast('Setup cancelled','warn');return false}
}
function derToRaw(der){let i=2;if(der[1]&0x80)i=2+(der[1]&0x7f);
  const rd=()=>{i++;const n=der[i++];let v=der.slice(i,i+n);i+=n;while(v.length>32&&v[0]===0)v=v.slice(1);const o=new Uint8Array(32);o.set(v,32-v.length);return o};
  const r=rd(),s=rd();return cat(r,s)}
async function bioVerify(cred,saved,challenge){
  const r=cred.response;
  if(b64u(cred.rawId)!==saved.id) return false;
  const cd=JSON.parse(new TextDecoder().decode(r.clientDataJSON));
  if(cd.type!=='webauthn.get'||cd.origin!==location.origin||cd.challenge!==b64u(challenge)) return false;
  const ad=new Uint8Array(r.authenticatorData); if(!(ad[32]&0x01)||!(ad[32]&0x04)) return false; // user present + verified
  if(!saved.pub) return true;
  const data=cat(ad,new Uint8Array(await crypto.subtle.digest('SHA-256',r.clientDataJSON))), sig=new Uint8Array(r.signature), spki=unb64u(saved.pub);
  if(saved.alg===-7){const k=await crypto.subtle.importKey('spki',spki,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);return crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,derToRaw(sig),data)}
  if(saved.alg===-257){const k=await crypto.subtle.importKey('spki',spki,{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['verify']);return crypto.subtle.verify('RSASSA-PKCS1-v1_5',k,sig,data)}
  return true;
}
async function bioUnlock(){
  const saved=bioGet(); if(!saved) return;
  try{
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const cred=await navigator.credentials.get({publicKey:{challenge,allowCredentials:[{type:'public-key',id:unb64u(saved.id),transports:['internal','hybrid']}],userVerification:'required',timeout:60000}});
    if(await bioVerify(cred,saved,challenge)){setAuth(true);render();toast('Welcome back, '+STORE.owner.split(' ')[0]+'! 👋','ok')}
    else toast('Could not verify — please use your PIN','err');
  }catch(e){toast(e&&e.name==='NotAllowedError'?'Cancelled — you can use your PIN':'Unlock failed — please use your PIN','warn')}
}

function barChart(data,{h=230}={}){
  const W=720,H=h,pl=46,pr=10,pt=22,pb=28,iw=W-pl-pr,ih=H-pt-pb;
  const max=Math.max(...data.map(d=>d.v),1); const step=Math.pow(10,Math.floor(Math.log10(max))); const nice=Math.ceil(max/step/ (max/step>5?1:.5))*step*(max/step>5?1:.5)||1;
  const cw=iw/data.length, bw=Math.min(28,cw*.62);
  const mi=data.reduce((m,d,i)=>d.v>data[m].v?i:m,0);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily sales bar chart">`;
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-8}" y="${y+4}" text-anchor="end">${kfmt(nice*i/4)}</text>`}
  data.forEach((d,i)=>{
    const bh=Math.max(d.v?2:0,ih*d.v/nice), x=pl+i*cw+(cw-bw)/2, y=pt+ih-bh, r=Math.min(4,bw/2,bh);
    const path=bh?`M${x},${y+bh}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${y+bh}Z`:'';
    s+=`<g class="col" data-tip="<b>${inr(d.v)}</b><br>${d.label}${d.sub?'<br>'+d.sub:''}"><rect class="hit" x="${pl+i*cw}" y="${pt}" width="${cw}" height="${ih}"/><path class="bar ${d.hl?'today':''}" d="${path}"/></g>`;
    if(i===mi||i===data.length-1) s+=`<text class="dl" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${kfmt(d.v)}</text>`;

  });

/* ---------- camera scanner ----------
   Uses the phone's built-in barcode reader when it has one (Android Chrome),
   otherwise ZXing (barcode-detector + zxing-wasm) — works on iPhone Safari too. */
const LOCAL_WASM=true;
const FMTS=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','itf','codabar','qr_code'];
let cam=null, _det=null;
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
async function getDetector(){
  if(_det) return _det;
  // ZXing (works everywhere, incl. iPhone)
  let zx=null; const API=window.BarcodeDetectionAPI;
  if(API){
    if(LOCAL_WASM) API.setZXingModuleOverrides({locateFile:(p,pre)=>p.endsWith('.wasm')?new URL('vendor/'+p,location.href).href:pre+p});
    zx=new API.BarcodeDetector({formats:FMTS});
    try{const c=document.createElement('canvas');c.width=c.height=8;await withTimeout(zx.detect(c),15000)}catch(e){if(/timeout/.test(e.message))zx=null}
  }
  // the phone's own reader (Android Chrome) — used first when it responds
  let nd=null;
  if('BarcodeDetector' in window){try{const sup=await withTimeout(window.BarcodeDetector.getSupportedFormats(),1500);if(sup&&sup.includes('ean_13'))nd=new window.BarcodeDetector({formats:FMTS.filter(x=>sup.includes(x))})}catch(e){}}
  if(!zx&&!nd) throw new Error('Scanner could not load — check your internet and reload the page');
  let fails=0,n=0;
  _det={async detect(src){
    n++;
    if(nd&&fails<2){try{const r=await withTimeout(nd.detect(src),1200);fails=0;if(r.length||!zx)return r}catch(e){fails++}}
    if(zx&&(!nd||fails>=2||n%2===0)) return zx.detect(src);
    return [];
  }};
  return _det;
}
function validCode(code){
  if(!code) return false;
  if(/^\d+$/.test(code)){
    const L=code.length;
    if(L===13) return ean(code.slice(0,12))===code;
    if(L===12) return ean('0'+code.slice(0,11)).slice(1)===code;
    if(L===8){let t=0;for(let i=0;i<7;i++)t+=(+code[i])*(i%2?1:3);return (10-t%10)%10===+code[7]}
    return L>=4;
  }
  return code.length>=3;
}
function camErr(e){
  const n=e&&e.name;
  if(n==='NotAllowedError'||n==='SecurityError') return 'Camera permission was blocked. Allow the camera for this website in your browser settings, then try again.';
  if(n==='NotFoundError'||n==='OverconstrainedError') return 'No camera found on this device.';
  if(n==='NotReadableError') return 'The camera is being used by another app. Close it and try again.';
  return 'Camera not available ('+esc(e&&e.message||e)+'). Open the website in Safari or Chrome, or use “Scan from photo”.';
}
async function startCamera(elId,onCode){
  await stopCamera();
  const host=document.getElementById(elId); if(!host) return false;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast(location.protocol==='https:'?camErr({}):'Camera scanning needs the https:// website link. You can still use “Scan from photo” or type the barcode.','warn');return false}
  host.innerHTML='<div class="cam-wait">Starting scanner…</div>';
  let det; try{det=await getDetector()}catch(e){host.innerHTML='';toast(esc(e.message),'err');return false}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}})}
  catch(e){try{stream=await navigator.mediaDevices.getUserMedia({video:true})}catch(e2){host.innerHTML='';toast(camErr(e2),'warn');return false}}
  if(!document.getElementById(elId)){stream.getTracks().forEach(t=>t.stop());return false}
  const v=document.createElement('video'); v.setAttribute('playsinline',''); v.setAttribute('muted',''); v.muted=true; v.autoplay=true; v.className='cam-video'; v.srcObject=stream;
  host.innerHTML=''; host.appendChild(v); host.insertAdjacentHTML('beforeend','<div class="scan-guide"></div>');
  try{await v.play()}catch(e){}
  const track=stream.getVideoTracks()[0];
  try{const caps=track.getCapabilities?track.getCapabilities():{}; if(caps.focusMode&&caps.focusMode.includes('continuous')) await track.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
  const me={stream,track,v,stopped:false,torch:false}; cam=me;
  const c=document.createElement('canvas'), ctx=c.getContext('2d',{willReadFrequently:true});
  let last='',lastT=0,cand='',candN=0;
  const tick=async()=>{
    if(me.stopped) return;
    if(v.readyState>=2&&v.videoWidth){
      try{
        const vw=v.videoWidth,vh=v.videoHeight,cw=Math.round(vw*.9),ch=Math.round(vh*.6),sc=Math.min(1,1280/cw);
        c.width=Math.round(cw*sc); c.height=Math.round(ch*sc);
        ctx.drawImage(v,(vw-cw)/2,(vh-ch)/2,cw,ch,0,0,c.width,c.height);
        const res=await det.detect(c);
        const hit=res.find(r=>validCode((r.rawValue||'').trim()));
        if(hit){
          const code=hit.rawValue.trim(); candN=code===cand?candN+1:1; cand=code;
          const t=Date.now();
          if(candN>=(hit.format==='qr_code'?1:2)&&!(code===last&&t-lastT<2500)){last=code;lastT=t;candN=0;try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}onCode(code)}
        }
      }catch(e){}
    }
    if(!me.stopped) me.timer=setTimeout(tick,80);
  };
  tick();
  return true;
}
async function stopCamera(){
  if(!cam) return; const c=cam; cam=null; c.stopped=true; clearTimeout(c.timer);
  try{c.stream.getTracks().forEach(t=>t.stop())}catch(e){}
  try{c.v.srcObject=null;c.v.remove()}catch(e){}
  $$('.scan-guide').forEach(e=>e.remove());
}
function torchSupported(){try{return !!(cam&&cam.track.getCapabilities&&cam.track.getCapabilities().torch)}catch(e){return false}}
async function toggleTorch(btn){if(!cam)return;try{cam.torch=!cam.torch;await cam.track.applyConstraints({advanced:[{torch:cam.torch}]});btn&&btn.classList.toggle('on',cam.torch)}catch(e){toast('Flashlight is not supported on this phone','warn')}}
async function scanPhoto(inp,cb){
  const file=inp.files&&inp.files[0]; inp.value=''; if(!file) return;
  toast('Reading barcode from photo…');
  try{
    const det=await getDetector(); const bmp=await createImageBitmap(file);
    let res=[];
    for(const max of [1600,1000,2400]){
      const sc=Math.min(1,max/Math.max(bmp.width,bmp.height)), c=document.createElement('canvas');
      c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
      res=(await det.detect(c)).filter(r=>validCode((r.rawValue||'').trim())); if(res.length) break;
    }
    if(res.length){beep(true);cb(res[0].rawValue.trim())}
    else{beep(false);toast('No barcode found in the photo. Hold the phone closer, keep the barcode straight and in good light.','warn')}
  }catch(e){toast('Could not read the photo: '+esc(e.message||e),'err')}
}

}

/* ---------- product lookup by barcode (free open databases) ---------- */
const LK={};
async function lookupBarcode(code){
  if(!/^\d{8,14}$/.test(code)) return null;
  if(code in LK) return LK[code];
  const fields='product_name,product_name_en,generic_name,brands,quantity,image_front_url,image_url,categories_tags';
  const tmo=ms=>{const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal};
  const one=async(base,kind)=>{
    const r=await fetch(`${base}/api/v2/product/${code}.json?fields=${fields}`,{signal:tmo(9000)}); const j=await r.json();
    const p=j&&j.status===1&&j.product; const name=p&&(p.product_name_en||p.product_name||p.generic_name||'').trim();
    if(!name) throw new Error('not found');
    return {name,brand:(p.brands||'').split(',')[0].trim(),qty:(p.quantity||'').trim(),img:p.image_front_url||p.image_url||'',cats:p.categories_tags||[],kind,src:base.replace('https://world.','')};
  };
  let info=null;
  try{info=await Promise.any([one('https://world.openfoodfacts.org','food'),one('https://world.openbeautyfacts.org','beauty'),one('https://world.openproductsfacts.org','product')])}catch(e){}
  let price=null;
  try{const r=await fetch(`https://prices.openfoodfacts.org/api/v1/prices?product_code=${code}&currency=INR&order_by=-date&size=1`,{signal:tmo(7000)});const j=await r.json();if(j.items&&j.items[0]&&j.items[0].price)price=+j.items[0].price}catch(e){}
  const out=info||price?{...(info||{}),price}:null; LK[code]=out; return out;
}
function guessCat(info){
  const t=(info.cats||[]).join(' ');
  if(info.kind==='beauty'||/beauty|cosmetic|hygiene|soap|shampoo|toothpaste|deodorant|perfume/.test(t)) return 'care';
  if(/baby/.test(t)) return 'kids';
  if(info.kind==='food') return 'daily';
  return null;
}
async function fillFromBarcode(code,quiet){
  const st=$('#lkStatus'); const f=$('#pf'); if(!st||!f) return;
  if(!/^\d{8,14}$/.test(code)){if(!quiet)toast('Enter or scan a numeric barcode first','warn');return}
  st.innerHTML='<span class="muted">🔎 Searching free product databases…</span>';
  const info=await lookupBarcode(code);
  if(!$('#pf')||$('#fbc').value.trim()!==code) return;
  if(!info){st.innerHTML='<span class="muted">Not found in the free product databases — please type the name and MRP.</span>';return}
  const done=[];
  if(info.name&&(!f.n.value.trim()||f.n.dataset.auto)){f.n.value=info.name+(info.qty&&/\d\s*(g|gm|grm|kg|ml|l|ltr|litre|liter|pcs|pc|tablets|caps)\b/i.test(info.qty)&&!/\d\s*(g|gm|grm|kg|ml|l|ltr|litre|liter|pcs|pc)\b/i.test(info.name)?' '+info.qty:'');f.n.dataset.auto='1';done.push('name')}
  if(info.brand&&(!f.b.value.trim()||f.b.dataset.auto)){f.b.value=info.brand;f.b.dataset.auto='1';done.push('brand')}
  const cat=info.name&&guessCat(info); if(cat&&!f.n.dataset.catset){f.c.value=cat;f.n.dataset.catset='1';done.push('category')}
  if(info.img&&!FORM.img){FORM.img=info.img;done.push('photo')}
  formPreview();
  st.innerHTML=(info.name?`<span style="color:var(--green);font-weight:700">✓ Found${info.src?' on '+esc(info.src):''}:</span> ${esc(info.name)}${done.length?' — filled '+done.join(', '):''}.`:'')+
    (info.price?` <button type="button" class="btn btn-xs" onclick="$('#pf').mrp.value='${info.price}';formPreview();this.remove()">Use reported price ₹${num(info.price)} as MRP</button>`:'')+
    `<div class="tiny muted" style="margin-top:4px">Please check the details${info.price?'':' and type the MRP from the pack'} before saving.</div>`;
}

function openSearch(site,byName){
  const f=$('#pf'); if(!f) return;
  const br=f.b.value.trim()==='C2C Select'?'':f.b.value.trim(), nm=f.n.value.trim();
  const name=br&&!nm.toLowerCase().startsWith(br.toLowerCase())?br+' '+nm:nm;
  const bc=f.bc.value.trim(), realBc=/^\d{8,14}$/.test(bc)&&!bc.startsWith('8906012');
  let q;
  if(site==='amazon') q=realBc&&!byName?bc:name;
  else if(site==='flipkart') q=name;
  else q=realBc?bc:name+' MRP';
  if(!q){toast('Type the product name or scan its barcode first','warn');return}
  const url={amazon:'https://www.amazon.in/s?k=',flipkart:'https://www.flipkart.com/search?q=',google:'https://www.google.com/search?q='}[site]+encodeURIComponent(q);
  window.open(url,'_blank','noopener');
}
function formData(){
  const f=$('#pf'); if(!f) return null;
  return {n:f.n.value.trim()||'Product name',b:f.b.value.trim()||'C2C Select',c:f.c.value,mrp:+f.mrp.value||0,on:+f.on.value||0,p:+f.p.value||0,s:parseInt(f.s.value)||0,bc:f.bc.value.trim(),
    t:$$('input[name=t]:checked',f).map(i=>i.value),sp:f.sp.value.split('\n').map(s=>s.trim()).filter(Boolean).join('|'),vis:f.vis.checked,e:FORM.e,img:FORM.img};
}
function formPreview(){
  const d=formData(); if(!d) return; const p={...d,id:'preview'};
  $('#fprev').innerHTML=card(p).replace(/onclick="[^"]*"/g,'').replace(/href="[^"]*"/g,'');
  const t=waText({...p,id:'new'}); const w=$('#fwa'); w.dataset.t=t; w.innerHTML=`<div class="wa-img">${img(p)}</div>${esc(t)}<small>${ftime(Date.now())}</small>`;
  $('#fwal').href='https://wa.me/?text='+encodeURIComponent(t);
  drawBarcode($('#fbcs'),d.bc||'000000000000',{height:50});
}
function drawBarcode(svg,code,o={}){
  if(!svg) return; if(typeof JsBarcode==='undefined'){svg.outerHTML=`<div style="font-family:monospace;padding:8px">${esc(code)}</div>`;return}
  const opts={height:o.height||46,width:o.width||1.6,fontSize:13,margin:2,displayValue:true};
  try{ if(/^\d{13}$/.test(code)) JsBarcode(svg,code,{...opts,format:'EAN13'}); else JsBarcode(svg,code,{...opts,format:'CODE128'}) }
  catch(e){ try{JsBarcode(svg,code,{...opts,format:'CODE128'})}catch(_){} }
}
function formPhoto(inp){
  const f=inp.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onerror=()=>toast('Could not read this photo. Please try a JPG or PNG.','err');im.onload=()=>{const c=document.createElement('canvas'),m=520,s=Math.min(1,m/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);FORM.img=c.toDataURL('image/jpeg',.72);formPreview();toast('Photo added','ok')};im.src=rd.result};
  rd.readAsDataURL(f);
}
function gotFieldCode(code){beep(true);const ex=DB.products.find(p=>p.bc===code);$('#fbc').value=code;closeModal();formPreview();toast(ex?`⚠ This barcode already belongs to “${esc(ex.n)}”`:'Barcode scanned: '+esc(code),ex?'warn':'ok');if(!ex)fillFromBarcode(code,true)}

function saveProduct(e,id){
  e.preventDefault(); const d=formData();
  if(d.bc){const dup=DB.products.find(p=>p.bc===d.bc&&p.id!==id); if(dup){toast(`Barcode already used by “${esc(dup.n)}”`,'err');return}}
  else d.bc=ean('8906012'+String(Date.now()).slice(-5));
  if(id){Object.assign(P(id),d);toast('✓ Product updated — live on website','ok')}
  else{const np={...d,id:'p'+Date.now(),added:Date.now()};DB.products.unshift(np);toast('✓ Product published on website','ok');setTimeout(()=>waPost(np.id),400)}
  save(); go('#/admin/inventory');
}
function delProduct(id){if(!confirm('Delete this product permanently?'))return;DB.products=DB.products.filter(p=>p.id!==id);save();toast('Product deleted');go('#/admin/inventory')}

/* ---------- orders ---------- */
function pgOrders(q){
  const tab=q.tab||'online', st=q.st||'';
  const NEXT={Placed:'Packed',Packed:'Dispatched',Dispatched:'Delivered'};
  let L=DB.orders.filter(o=>o.ch==='online').reverse(); const all=L;
  if(st) L=L.filter(o=>o.status===st);
  const cnt=s=>all.filter(o=>o.status===s).length;
  const enq=DB.enq;
  const tabs=`<div class="seg" style="margin-bottom:16px">${[['online','🌐 Online orders'],['enq',`📦 Bulk enquiries (${enq.filter(x=>!x.done).length})`]].map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('#/admin/orders?tab=${t[0]}')">${t[1]}</button>`).join('')}</div>`;
  let body='';
  if(tab==='online'){
    body=`<div class="chips" style="margin-bottom:14px">${[['','All',all.length],['Placed','🆕 New',cnt('Placed')],['Packed','📦 Packed',cnt('Packed')],['Dispatched','🚚 Dispatched',cnt('Dispatched')],['Delivered','✅ Delivered',cnt('Delivered')]].map(x=>`<a class="chip ${st===x[0]?'on':''}" href="#/admin/orders?st=${x[0]}">${x[1]} · ${x[2]}</a>`).join('')}</div>
    ${cnt('Placed')+cnt('Packed')?`<div class="live" style="background:var(--blue-soft);color:var(--blue)"><span>📋</span>Tip: Pack & dispatch yesterday's orders first, then today's — one by one.</div>`:''}
    <div class="card">${L.slice(0,40).map(o=>`<div class="oc"><div class="row wrap-ok"><b>${o.id}</b><span class="pill ${o.status==='Delivered'?'p-green':o.status==='Placed'?'p-brand':o.status==='Packed'?'p-amber':'p-blue'}">${o.status}</span><span class="pill p-gray">${o.mode==='pickup'?'🏬 Pickup':'🚚 Delivery'}</span><span class="pill p-gray">${o.pay}</span>${o.gift?'<span class="pill p-gold" style="background:var(--gold-soft);color:var(--amber)">🎁 Gift wrap</span>':''}<span class="sp"></span><span class="small muted">${fdt(o.ts)}</span><b>${inr(o.total)}</b></div>
      <div class="small" style="margin:8px 0"><b>${esc(o.cust.name)}</b> · ${esc(o.cust.phone)} · <span class="muted">${esc(o.cust.addr)}${o.cust.pin&&o.mode!=='pickup'?' – '+esc(o.cust.pin):''}</span></div>
      <div class="small muted">${o.items.map(i=>`${esc(P(i[0])?.n||'Item')} × ${i[1]}`).join(' · ')}${o.msg?` · <i>Gift note: “${esc(o.msg)}”</i>`:''}</div>
      <div class="row wrap-ok" style="margin-top:10px">${NEXT[o.status]?`<button class="btn btn-sm btn-brand" onclick="advOrder('${o.id}')">Mark as ${NEXT[o.status]==='Dispatched'&&o.mode==='pickup'?'Ready for pickup':NEXT[o.status]}</button>`:''}
        <a class="btn btn-sm btn-wa" ${cl(o,waLink('91'+o.cust.phone,`Hi ${o.cust.name.split(' ')[0]}, your C2C Gift House order ${o.id} is now *${NEXT[o.status]||o.status}*. Thank you for shopping with us! 🙏`))}>💬 Update customer</a>
        <a class="btn btn-sm" ${cl(o,'tel:+91'+o.cust.phone,false)}>📞 Call</a><button class="btn btn-sm" onclick="showReceipt('${o.id}')">🖨 Packing slip</button></div></div>`).join('')||'<div class="empty"><i>📭</i>No orders here</div>'}</div>`;
  } else {
    body=`<div class="card">${enq.map(x=>`<div class="oc"><div class="row wrap-ok"><b>${esc(x.name)}</b><span class="small muted">${esc(x.phone)} · ${fdt(x.ts)}</span><span class="sp"></span>${x.done?'<span class="pill p-green">Replied</span>':'<span class="pill p-brand">New</span>'}</div>
      ${x.org?`<div class="small b" style="margin-top:6px">${esc(x.org)}</div>`:''}<div class="small muted" style="margin:4px 0 10px">${esc(x.need)}</div>
      <div class="row">${false?``:`<a class="btn btn-sm btn-wa" target="_blank" rel="noopener" href="${waLink('91'+x.phone,`Hi ${x.name.split(' ')[0]}, thank you for your bulk enquiry at C2C Gift House. `)}" onclick="setTimeout(()=>doneX('enq','${x.id}'),300)">💬 Reply on WhatsApp</a>`}${x.done?'':`<button class="btn btn-sm" onclick="doneX('enq','${x.id}')">Mark replied</button>`}</div></div>`).join('')||'<div class="empty"><i>📭</i>No enquiries yet</div>'}</div>`;

function advOrder(id){const NEXT={Placed:'Packed',Packed:'Dispatched',Dispatched:'Delivered'};const o=DB.orders.find(x=>x.id===id);o.status=NEXT[o.status]||o.status;save();render();toast(`${id} → ${o.status}`,'ok')}
function doneX(k,id){const x=DB[k].find(y=>y.id===id);if(x){x.done=true;save();render()}}

/* ---------- sales & reports ---------- */
function pgSales(q){
  const range=q.range||'7', days=range==='today'?1:+range;
  const since=startOfDay()-(days-1)*DAY;
  const L=DB.orders.filter(o=>o.ts>=since);
  const prev=DB.orders.filter(o=>o.ts>=since-days*DAY&&o.ts<since);
  const rev=L.reduce((a,o)=>a+o.total,0), prevRev=prev.reduce((a,o)=>a+o.total,0);
  const st=L.filter(o=>o.ch==='store'), on=L.filter(o=>o.ch==='online');
  const units=L.reduce((a,o)=>a+o.items.reduce((b,i)=>b+i[1],0),0);
  const mrpTot=L.reduce((a,o)=>a+o.items.reduce((b,i)=>b+i[1]*(cmpAt(P(i[0])||{})||i[2]),0),0);
  const pays={};L.forEach(o=>pays[o.pay]=(pays[o.pay]||0)+o.total);
  const cats={};L.forEach(o=>o.items.forEach(i=>{const c=catOf(P(i[0])?.c).n;cats[c]=(cats[c]||0)+i[1]*i[2]}));
  const prods={};L.forEach(o=>o.items.forEach(i=>{prods[i[0]]=prods[i[0]]||{q:0,v:0};prods[i[0]].q+=i[1];prods[i[0]].v+=i[1]*i[2]}));
  const topP=Object.entries(prods).sort((a,b)=>b[1].v-a[1].v).slice(0,10);
  const chg=prevRev?Math.round((rev-prevRev)/prevRev*100):0;
  const content=`
    <div class="toolbar"><div class="seg">${[['today','Today'],['7','7 days'],['30','30 days']].map(r=>`<button class="${range===r[0]?'on':''}" onclick="go('#/admin/sales?range=${r[0]}')">${r[1]}</button>`).join('')}</div><span class="sp"></span><button class="btn btn-sm" onclick="exportSales(${since})">⬇ Export CSV</button></div>
    <div class="kpis">
      <div class="kpi"><span>Total sales</span><b>${inr(rev)}</b><small class="${chg>=0?'up':'dn'}">${chg>=0?'▲':'▼'} ${Math.abs(chg)}% vs previous ${days===1?'day':days+' days'}</small></div>
      <div class="kpi"><span>🏬 In-shop (billing)</span><b>${inr(st.reduce((a,o)=>a+o.total,0))}</b><small>${st.length} bills</small></div>
      <div class="kpi"><span>🌐 Online (website)</span><b>${inr(on.reduce((a,o)=>a+o.total,0))}</b><small>${on.length} orders</small></div>
      <div class="kpi"><span>Avg. bill value</span><b>${inr(L.length?Math.round(rev/L.length):0)}</b><small>${units} units sold</small></div>
      <div class="kpi"><span>Customers saved vs MRP</span><b>${kfmt(Math.max(0,mrpTot-rev))}</b><small>great for marketing posts!</small></div>
    </div>
    ${days>1?`<div class="card pad" style="margin-bottom:16px"><div class="ch-h"><div><h3>Daily sales</h3><p>₹ per day, shop + online</p></div></div>${barChart(dailySeries(days),{h:250})}</div>`:''}
    <div class="dash-g" style="grid-template-columns:1fr 1fr">
      <div class="card pad"><div class="ch-h"><div><h3>Sales by category</h3><p>₹ revenue</p></div></div>${hbars(Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l,v})))}</div>
      <div class="card pad"><div class="ch-h"><div><h3>Payment methods</h3><p>₹ collected</p></div></div>${hbars(Object.entries(pays).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l,v,sub:Math.round(v/rev*100)+'% of sales'})))}</div>
    </div>
    <div class="card pad" style="margin-bottom:16px"><div class="ch-h"><h3>Top products</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Product</th><th class="num">Units</th><th class="num">Revenue</th><th class="num">Stock left</th></tr></thead><tbody>
      ${topP.map(([id,x])=>{const p=P(id)||{n:id,b:'',s:0,e:'📦',c:'gifts'};return `<tr><td><div class="row" style="gap:10px"><div class="mini">${img(p)}</div><div><b class="small">${esc(p.n)}</b><div class="tiny muted">${esc(p.b)}</div></div></div></td><td class="num">${x.q}</td><td class="num b">${inr(x.v)}</td><td class="num"><span class="pill ${p.s<=0?'p-red':p.s<=3?'p-amber':'p-gray'}">${Math.max(0,p.s)}</span></td></tr>`}).join('')}</tbody></table></div></div>
    <div class="card pad"><div class="ch-h"><h3>All bills & orders</h3><span class="small muted">${L.length} records</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>ID</th><th>Date & time</th><th>Channel</th><th>Items</th><th>Payment</th><th class="num">Total</th><th></th></tr></thead><tbody>
      ${[...L].reverse().slice(0,60).map(o=>`<tr><td class="b">${o.id}</td><td class="small nowrap">${fdt(o.ts)}</td><td><span class="pill ${o.ch==='store'?'p-gray':'p-blue'}">${o.ch==='store'?'Shop':'Online'}</span></td><td class="small">${o.items.reduce((a,i)=>a+i[1],0)}</td><td class="small">${o.pay}</td><td class="num b">${inr(o.total)}</td><td><button class="btn btn-xs" onclick="showReceipt('${o.id}')">Receipt</button></td></tr>`).join('')}</tbody></table></div></div>`;
  return admShell('sales','Sales & reports',content);
}
function exportSales(since){const L=DB.orders.filter(o=>o.ts>=since);download('c2c-sales.csv',csv([['ID','Date','Channel','Product','Qty','Price','Line total','Payment','Bill total'],...L.flatMap(o=>o.items.map(i=>[o.id,new Date(o.ts).toLocaleString('en-IN'),o.ch,P(i[0])?.n,i[1],i[2],i[1]*i[2],o.pay,o.total]))]));toast('Sales exported')}

/* ---------- labels ---------- */
const LSEL={};
function pgLabels(){
  AFTER.push(drawLabels);
  const content=`<div class="dash-g" style="grid-template-columns:1fr 1.4fr;align-items:start">
    <div class="card pad"><div class="ch-h"><div><h3>Choose products</h3><p>Print price + barcode stickers for items without a barcode, or for shelf labels.</p></div></div>
      <input class="inp" placeholder="🔍 Search…" style="margin-bottom:10px" oninput="const v=this.value.toLowerCase();$$('#lsel>div').forEach(d=>d.style.display=d.dataset.s.includes(v)?'':'none')">
      <div id="lsel" style="max-height:60vh;overflow:auto">${DB.products.map(p=>`<div class="list-r" data-s="${esc((p.n+' '+p.b).toLowerCase())}"><div class="mini">${img(p)}</div><div style="flex:1;min-width:0"><b class="small" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.n)}</b><span class="tiny muted">${inr(p.p)} · ${p.bc}</span></div>
        <div class="qty sm"><button onclick="lAdj('${p.id}',-1)">−</button><span id="lq_${p.id}">${LSEL[p.id]||0}</span><button onclick="lAdj('${p.id}',1)">+</button></div></div>`).join('')}</div></div>
    <div class="card pad"><div class="ch-h"><div><h3>Label sheet preview</h3><p id="lcount"></p></div><div class="row"><button class="btn btn-sm btn-ghost" onclick="for(const k in LSEL)delete LSEL[k];render()">Clear</button><button class="btn btn-sm btn-brand" onclick="window.print()">🖨 Print labels</button></div></div>
      <div class="lsheet printable" id="lsheet"></div></div>
  </div>`;
  return admShell('labels','Barcode labels',content);
}
function lAdj(id,d){LSEL[id]=Math.max(0,(LSEL[id]||0)+d);if(!LSEL[id])delete LSEL[id];$('#lq_'+id).textContent=LSEL[id]||0;drawLabels()}
function drawLabels(){
  const el=$('#lsheet'); if(!el) return;
  if(!Object.keys(LSEL).length){LSEL.p5=2;LSEL.p28=2;LSEL.p44=1;LSEL.p64=3;['p5','p28','p44','p64'].forEach(id=>{const q=$('#lq_'+id);if(q)q.textContent=LSEL[id]})}
  const L=Object.entries(LSEL).flatMap(([id,n])=>Array(n).fill(P(id))).filter(Boolean);
  $('#lcount').textContent=L.length+' labels';
  el.innerHTML=L.map((p,i)=>`<div class="lbl"><div class="lb">C2C Gift House</div><div class="ln">${esc(p.n)}</div><svg id="lb${i}"></svg><div class="lp">${inr(p.p)}${cmpAt(p)>p.p?`<s>MRP ${inr(cmpAt(p))}</s>`:''}</div></div>`).join('');
  L.forEach((p,i)=>drawBarcode($('#lb'+i),p.bc,{height:38,width:1.3}));
}

/* ---------- settings ---------- */
function pgSettings(){
  const S=DB.settings; AFTER.push(bioSettingsBox);
  const content=`<div style="max-width:760px">
    <form class="card pad" style="margin-bottom:16px" onsubmit="saveSettings(event)">
      <h3 style="font-family:var(--f);font-size:16px;font-weight:800;margin-bottom:6px">📢 Store notice banner</h3><p class="small muted" style="margin:0 0 14px">Shows at the top of the website — for holidays, closures or big announcements.</p>
      <label class="check" style="margin-bottom:10px"><input type="checkbox" name="noticeOn" ${S.noticeOn?'checked':''}> Show notice on website</label>
      <div class="field"><textarea class="inp" name="notice">${esc(S.notice)}</textarea></div>
      <div class="chips" style="margin-bottom:18px">${['📢 Dear Customers, our store will remain closed tomorrow due to personal work. All pending parcels will be dispatched today itself. 🙏','🌙 Eid Mubarak! Shop closed for 2 days for the festival. Orders will be dispatched after we reopen.','🔥 Weekend offer live — Saturday & Sunday only prices!'].map(t=>`<button type="button" class="chip" onclick="this.form.notice.value=${JSON.stringify(t).replace(/"/g,'&quot;')};this.form.noticeOn.checked=true">${esc(t.slice(0,38))}…</button>`).join('')}</div>
      <h3 style="font-family:var(--f);font-size:16px;font-weight:800;margin-bottom:14px">🚚 Delivery & payments</h3>
      <div class="f3"><div class="field"><label>Delivery fee (₹)</label><input class="inp" type="number" name="delFee" value="${S.delFee}"></div><div class="field"><label>Free delivery above (₹)</label><input class="inp" type="number" name="freeAbove" value="${S.freeAbove}"></div><div class="field"><label>Gift packing (₹)</label><input class="inp" type="number" name="gift" value="${S.gift}"></div></div>
      <div class="f2"><div class="field"><label>UPI ID (for payment QR codes)</label><input class="inp" name="upi" value="${esc(S.upi)}" placeholder="e.g. 9110261958@ybl"></div><div class="field"><label>Store hours</label><input class="inp" name="hours" value="${esc(S.hours)}"></div></div>
      <div class="f2"><div class="field"><label>Admin PIN</label><input class="inp" name="pin" maxlength="4" inputmode="numeric" value="${esc(S.pin)}"></div></div>
      <button class="btn btn-brand">Save settings</button>
    </form>
    <div class="card pad" style="margin-bottom:16px" id="bioSet"></div>
    <div class="card pad"><h3 style="font-family:var(--f);font-size:16px;font-weight:800;margin-bottom:6px">🧪 Demo data</h3><p class="small muted" style="margin:0 0 14px">All data in this demo is saved in this browser only. In the real website, it will be saved on a secure server so the shop phone, the counter computer and customers all see the same live stock.</p>
      <button class="btn" style="color:var(--red)" onclick="if(confirm('Reset all demo data (products, orders, stock)?')){localStorage.removeItem(KEY);DB=seed();save();toast('Demo data reset','ok');go('#/admin')}">Reset demo data</button></div>
  </div>`;
  return admShell('settings','Store settings',content);
}
function saveSettings(e){e.preventDefault();const f=e.target,S=DB.settings;S.noticeOn=f.noticeOn.checked;S.notice=f.notice.value;S.delFee=+f.delFee.value||0;S.freeAbove=+f.freeAbove.value||0;S.gift=+f.gift.value||0;S.upi=f.upi.value.trim();S.hours=f.hours.value;if(/^\d{4}$/.test(f.pin.value))S.pin=f.pin.value;save();toast('✓ Settings saved — live on website','ok')}

    <div class="dsec">Customer website</div>
    ${L('🏠','#/','Home page','Deal of the day, categories, weekend offer, price comparison, store map')}
    ${L('🛍️','#/shop','Shop / catalogue','Search, filter by category, price, brand, deals · sort')}
    ${L('📦','#/p/p44','Product page','MRP vs online vs C2C price, live stock, WhatsApp order, delivery check')}
    ${L('🔥','#/offers','Offers','Weekend countdown, 70%+ off, combos, limited stock')}
    ${L('🛒','#/cart','Cart & checkout','Delivery / pickup, gift wrap, UPI / COD, coupon C2C50')}
    ${L('🚚','#/track','Track order','Order status timeline')}
    ${L('🏢','#/wholesale','Wholesale','Bulk quote form for weddings, shops, schools')}
    ${L('📍','#/visit','Visit store & FAQ','Address, map, hours, FAQs')}
    <div class="dsec">Shop admin (PIN ${DB.settings.pin})</div>
    ${L('📊','#/admin','Dashboard','Today\'s sales, charts, low stock, recent bills')}
    ${L('📷','#/admin/pos','Billing & barcode scanner','Scan → bill → payment → receipt · stock updates live')}
    ${L('📥','#/admin/pos?mode=stockin','Receive stock by scanning','Scan new stock into inventory')}
    ${L('🗃️','#/admin/inventory','Inventory','Stock +/−, low stock, export, WhatsApp post')}
    ${L('➕','#/admin/product/new','Add product','Auto WhatsApp post, barcode scan/generate, photo')}

    ${L('📈','#/admin/sales','Sales & reports','Shop vs online, categories, payments, top products, CSV')}
    ${L('🏷️','#/admin/labels','Barcode labels','Print price + barcode stickers')}
    ${L('⚙️','#/admin/settings','Store settings','Holiday notice banner, delivery fee, UPI')}
  </div>
  <div class="live" style="margin:14px 0 0;background:var(--gold-soft);color:var(--amber-ink)"><span>💡</span><span><b>Try this:</b> open a product page → note the stock → go to Billing, scan that product, complete the sale → come back: stock has gone down.</span></div>`);
}

/* ---------- photo credits ---------- */
function photoCredits(){
  const C=window.PHOTO_CREDITS||[];
  modal('Photo credits',`<p class="small muted" style="margin-top:0">Demo product photos are sample images from free sources, used under their licences. In the real website these will be replaced with photos of C2C Gift House's own stock.</p>
  <div class="small">${C.map(c=>{const p=P(c.id);return `<div class="list-r"><div class="mini">${p?img(p):''}</div><div style="flex:1;min-width:0"><b>${esc(p?p.n:c.id)}</b><div class="tiny muted">${esc(c.src)}${c.by?' · '+esc(c.by):''}${c.lic?' · '+esc(c.lic):''}</div></div>${c.url?`<a class="btn btn-xs" target="_blank" rel="noopener" href="${esc(c.url)}">Source</a>`:''}</div>`}).join('')}</div>`);
}

/* ---------- theme ---------- */
function curTheme(){const t=document.documentElement.dataset.theme;return t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function toggleTheme(){const t=curTheme()==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('c2c_theme',t)}catch(e){}toast(t==='dark'?'🌙 Dark mode on':'☀️ Light mode on')}
try{const t=localStorage.getItem('c2c_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}

/* ---------- boot ---------- */
load();
window.addEventListener('DOMContentLoaded',()=>{});
render();
</script>
</body>
